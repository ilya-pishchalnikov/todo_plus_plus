name: Build and Deploy Go Application to the Test Environment

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.21'

      - name: Build
        run: |
          go build -v -o ./output/todopp ./todopp.go 

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Vue.js Application
        run: |
          cd vue/
          npm install
          npm run build
          
      - name: Copy files
        run: |
          mkdir ./output/sql
          mkdir ./output/doc/
          mkdir ./output/vue/
          mkdir ./output/vue/dist
          cp -r vue/dist/* ./output/vue/dist/
          cp -r sql/* ./output/sql/ 
          cp -r doc/* ./output/doc/
          cp README.md LICENSE ./output/doc/
          echo "${{ secrets.CONFIG }}" > ./output/config.json

      - name: Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-linux
          path: ./output/
          retention-days: 1

      - name: Remove files from VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: rm -rf /usr/local/bin/todopp/bin/

      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "./output/*"
          target: "/usr/local/bin/todopp/bin"

      - name: Reboot VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cp -aT /usr/local/bin/todopp/bin/output/ /usr/local/bin/todopp/bin/
            rm -rf /usr/local/bin/todopp/bin/output
            reboot